[project]
name = "ouroboros"
version = "3.3.3"
description = "Self-creating AI agent with constitution"
authors = [{name = "Sergey Pezhemsky", email = "sergey@pezhemsky.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "pywebview>=4.0",
    "anthropic>=0.18.0",
    "aiofiles>=23.0.0",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/SergeyPezhemsky/uroborus"
Repository = "https://github.com/SergeyPezhemsky/uroborus"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ouroboros*", "supervisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]